server {
    listen       80;
    server_name  localhost;

    location ~ ^/api/|^.*\.json$|^/proxy/ {
        proxy_pass          http://backend:8000;
        proxy_http_version  1.1;
        proxy_set_header    Host $host;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_buffering     off;
        proxy_read_timeout  1h;
        proxy_send_timeout  1h;
    }

    # SPA fallback for /u/<uid> is handled by Vite's history fallback
    # (frontend:5173 serves index.html for unknown routes). No try_files
    # needed here; the proxy preserves the original URI for react-router.
    # Production fallback is in unit-nginx-config.json:
    #   share "/app/frontend$uri" + fallback "/app/frontend/index.html"
    location / {
        proxy_pass          http://frontend:5173;
        proxy_http_version  1.1;
        proxy_set_header    Host $host;
        proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
    }
}